[project]
name = "trikon"
version = "0.1.0"
description = "Three-way settlement reconciliation controller: merchant orders, Razorpay settlements, bank credits"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "scipy>=1.13",
    "numpy>=1.26",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
trikon = "trikon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trikon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# NOTE: some system Python installs (e.g. a ROS distribution on PATH) register pytest
# plugins globally that fail to import. Trikon needs no third-party plugins, so run tests
# with plugin autoloading disabled:
#     PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest
# The provided `make test` target does this for you.

[tool.ruff]
line-length = 100
target-version = "py311"
